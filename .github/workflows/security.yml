name: security

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          check-latest: true
          cache: true
      - uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: go
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          check-latest: true
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  gosec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          check-latest: true
          cache: true
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 -quiet -fmt=golint -tests -nosec-require-justification -nosec-require-rules ./...

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          check-latest: true
          cache: true
      - name: Scan current tree and pushed history
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --config .gitleaks.toml --no-banner --redact=100 --exit-code 1 .

          probe_root="$(mktemp -d)"
          trap 'rm -rf "${probe_root}"' EXIT
          # shellcheck disable=SC2016 # the synthetic value must retain its literal marker
          printf 'db_%s: "Synthetic$Value#123"\n' 'password' >"${probe_root}/assignment.txt"
          # shellcheck disable=SC2016 # the synthetic value must retain its literal marker
          printf 'service_%s_hash: "$Synthetic#Value123456789"\n' 'secret' >"${probe_root}/dollar-prefix.txt"
          # shellcheck disable=SC2016 # the synthetic value must retain its literal marker
          printf 'service_%s_hash: "$UPPER_ENV"\n' 'secret' >"${probe_root}/unbraced-env.txt"
          # shellcheck disable=SC2016 # the synthetic value must retain its literal marker
          printf 'service_%s_hash: "${lower_env}"\n' 'secret' >"${probe_root}/lowercase-env.txt"
          # shellcheck disable=SC2016 # the synthetic value must retain its literal marker
          printf 'service_%s_hash: "${UPPER_ENV}suffix"\n' 'secret' >"${probe_root}/suffixed-env.txt"
          # shellcheck disable=SC2016 # the synthetic value must retain its literal marker
          printf 'service_%s_hash: "prefix${UPPER_ENV}"\n' 'secret' >"${probe_root}/prefixed-env.txt"
          # shellcheck disable=SC2016 # the synthetic value must retain its literal marker
          printf 'service_%s_hash: "${UPPER_ENV} suffix"\n' 'secret' >"${probe_root}/spaced-suffix-env.txt"
          # shellcheck disable=SC2016 # the synthetic value must retain its literal marker
          printf '<%s>Synthetic$Value#123</%s>\n' 'password' 'password' >"${probe_root}/element.xml"
          # shellcheck disable=SC2016 # the synthetic value must retain its literal marker
          printf 'postgres%s\n' '://synthetic-user:Synthetic$Value#123@service.example/database' >"${probe_root}/url.txt"
          # shellcheck disable=SC2016 # the safe value must retain its literal reference
          printf 'service_%s_hash: "${UPPER_ENV}"\n' 'secret' >"${probe_root}/exact-env.txt"
          for probe in assignment dollar-prefix unbraced-env lowercase-env suffixed-env prefixed-env spaced-suffix-env element url; do
            probe_dir="${probe_root}/${probe}"
            mkdir "${probe_dir}"
            case "${probe}" in
              assignment) cp "${probe_root}/assignment.txt" "${probe_dir}/config.yaml" ;;
              dollar-prefix) cp "${probe_root}/dollar-prefix.txt" "${probe_dir}/config.yaml" ;;
              unbraced-env) cp "${probe_root}/unbraced-env.txt" "${probe_dir}/config.yaml" ;;
              lowercase-env) cp "${probe_root}/lowercase-env.txt" "${probe_dir}/config.yaml" ;;
              suffixed-env) cp "${probe_root}/suffixed-env.txt" "${probe_dir}/config.yaml" ;;
              prefixed-env) cp "${probe_root}/prefixed-env.txt" "${probe_dir}/config.yaml" ;;
              spaced-suffix-env) cp "${probe_root}/spaced-suffix-env.txt" "${probe_dir}/config.yaml" ;;
              element) cp "${probe_root}/element.xml" "${probe_dir}/config.xml" ;;
              url) cp "${probe_root}/url.txt" "${probe_dir}/config.txt" ;;
            esac
            if go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --config .gitleaks.toml --no-banner --redact=100 --exit-code 1 "${probe_dir}" >/dev/null 2>&1; then
              echo "gitleaks regression probe was not rejected: ${probe}" >&2
              exit 1
            fi
          done
          exact_env_dir="${probe_root}/exact-env"
          mkdir "${exact_env_dir}"
          cp "${probe_root}/exact-env.txt" "${exact_env_dir}/config.yaml"
          if ! go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --config .gitleaks.toml --no-banner --redact=100 --exit-code 1 "${exact_env_dir}" >/dev/null 2>&1; then
            echo "gitleaks rejected exact braced uppercase environment reference" >&2
            exit 1
          fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              base_sha="$(jq -r '.pull_request.base.sha // empty' "${GITHUB_EVENT_PATH}")"
              head_sha="$(jq -r '.pull_request.head.sha // empty' "${GITHUB_EVENT_PATH}")"
              ;;
            merge_group)
              base_sha="$(jq -r '.merge_group.base_sha // empty' "${GITHUB_EVENT_PATH}")"
              head_sha="$(jq -r '.merge_group.head_sha // empty' "${GITHUB_EVENT_PATH}")"
              ;;
            push)
              base_sha="$(jq -r '.before // empty' "${GITHUB_EVENT_PATH}")"
              head_sha="$(jq -r '.after // empty' "${GITHUB_EVENT_PATH}")"
              ;;
            *)
              echo "unsupported GitHub event for secret history scan: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          head_sha="${head_sha:-${GITHUB_SHA}}"
          test -n "${head_sha}"
          git cat-file -e "${head_sha}^{commit}"
          if [[ -n "${base_sha}" && ! "${base_sha}" =~ ^0+$ ]]; then
            git cat-file -e "${base_sha}^{commit}"
            history_spec="${base_sha}..${head_sha}"
          else
            history_spec="${head_sha}"
          fi
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --config .gitleaks.toml --no-banner --redact=100 --exit-code 1 --platform github \
            --log-opts="--full-history --diff-merges=separate ${history_spec}" .
